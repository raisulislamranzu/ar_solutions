{% extends 'custom_admin/base.html' %}
{% block title %}Delete {{ type }}{% endblock %}
{% block page_title %}Delete {{ type }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card stat-card border-danger">
            <div class="card-header bg-danger text-white"><strong>Confirm Delete</strong></div>
            <div class="card-body text-center">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size:48px;"></i>
                <p class="mt-3">Are you sure you want to delete this {{ type|lower }}?</p>
                <h5 class="mb-4">{{ object }}</h5>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Yes, Delete</button>
                    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
