<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | AR SOLUTIONS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e2a3a 0%, #269a53 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { max-width: 420px; margin: auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-card .card-header { background: #1e2a3a; color: #fff; border-radius: 12px 12px 0 0; }
        .btn-login { background: #269a53; border: none; }
        .btn-login:hover { background: #1e7d43; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card login-card">
            <div class="card-header text-center py-4">
                <h3 class="mb-0">🛠️ AR SOLUTIONS Admin</h3>
                <small>Please sign in to continue</small>
            </div>
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger">
                        Your username and password didn't match. Please try again.
                    </div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-login w-100 text-white py-2">Sign In</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
